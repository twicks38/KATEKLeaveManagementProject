{% load static %}

<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
  </head>

  <body>
    {% include 'includes/messages.html' %}
    <div class="whitespace-body">
      <div class="login-container">
        <div class="login-header">
          <img
            class="login-header-logo"
            src="{% static 'images/favicon.png' %}"
            alt="KADTEK Logo"
          />
          <h1>Welcome to KADTEK Ltd.</h1>
        </div>

        <form
          class="login-form"
          method="post"
          action="{% url 'accounts:user_authenticate' %}"
        >
          {% csrf_token %}
          <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <div>
            <a href="{% url 'accounts:forgot_password' %}">Forgot password?</a>
          </div>

          <div>
            <button class="default-button"type="submit">Log in</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
